name: Android mobile regression audit

on:
  push:
    branches: ["main", "android-review", "android-phone-layout-pass", "android-complete-mobile-20261030"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-android-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Capture pre-update desktop baseline from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:index.html > /tmp/guionero-desktop-baseline.html
          test -s /tmp/guionero-desktop-baseline.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check embedded JavaScript and HTML structure
        run: npm run check --if-present
      - name: Run Android touch and desktop regression suite
        run: node tests/android-smoke.mjs
        env:
          GUIONERO_DESKTOP_BASELINE: /tmp/guionero-desktop-baseline.html

name: Guionero browser validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML and inline JavaScript
        run: node scripts/check-html.js
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Check new mobile and Script test JavaScript
        run: |
          node --check guionero-mobile-crossplatform.js
          node --check tests/ios-mobile-smoke.cjs
          node --check tests/script-enter-flow.cjs
          node --check tests/script-format-autonomy.cjs
          node --check tests/mobile-script-layout.cjs
      - name: Run Script Enter desktop, Android and iPhone tests
        run: node tests/script-enter-flow.cjs
      - name: Run Script format conversion desktop, Android and iPhone tests
        run: node tests/script-format-autonomy.cjs
      - name: Run mobile Script layout, drawer actions and keyboard viewport tests
        run: node tests/mobile-script-layout.cjs
      - name: Run desktop and Android browser tests
        run: node tests/guionero-browser-smoke.cjs
      - name: Run iPhone WebKit mobile tests
        run: node tests/ios-mobile-smoke.cjs

  windows-script-enter:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML and Script test JavaScript
        run: |
          node scripts/check-html.js
          node --check tests/script-enter-flow.cjs
          node --check tests/script-format-autonomy.cjs
          node --check tests/mobile-script-layout.cjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Windows desktop Script Enter test
        run: node tests/script-enter-flow.cjs --desktop-only
      - name: Run Windows desktop Script format test
        run: node tests/script-format-autonomy.cjs --desktop-only
      - name: Run Windows mobile-layout desktop protection test
        run: node tests/mobile-script-layout.cjs --desktop-only
